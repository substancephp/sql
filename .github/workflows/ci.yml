name: check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      id: setup-php
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run linter
      run: composer run lint

    - name: Run static analysis
      run: composer run stan

    - name: Run tests
      run: composer run test

  postgres:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      id: setup-php
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-pgsql-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-pgsql-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run PostgreSQL tests
      env:
        SUBSTANCEPHP_SQL_POSTGRES_DSN: >-
          pgsql:host=127.0.0.1;port=5432;dbname=postgres;user=postgres;password=postgres
      run: composer run test-pgsql
